<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-R" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambrose Scores</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>
    <main id="leaderboard">
        <h1 id="main-title">Loading...</h1>
        <div class="table-container">
            <table id="score-table">
                <thead>
                    <tr id="table-headers">
                    </tr>
                </thead>
                <tbody id="score-body">
                </tbody>
                <tfoot id="score-footer">
                </tfoot>
            </table>
        </div>
        <div class="note">
            * Grayed-out scores indicate a default score was registered.
        </div>

        <div class="chart-container">
            <h2>Team Totals Over Time</h2>
            <canvas id="scoreChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h2>Weekly Round Scores</h2>
            
            <p>Use the checkboxes to show/hide teams. (Lowest score is best).</p>
            
            <div id="team-toggle-container"></div>
            
            <canvas id="weeklyScoreChart"></canvas>
        </div>
        <div class="calc-container">
            <h2>Net Score Calculator</h2>
            
            <div class="input-group">
                <label>Player Initials & Handicaps</label>
                <div class="hcp-row">
                    <div class="player-col">
                        <input type="text" id="p1-name" class="init-input" placeholder="NM" maxlength="3">
                        <input type="number" id="p1-hcp" class="hcp-input" placeholder="0.0" step="0.1">
                    </div>
                    <div class="player-col">
                        <input type="text" id="p2-name" class="init-input" placeholder="NM" maxlength="3">
                        <input type="number" id="p2-hcp" class="hcp-input" placeholder="0.0" step="0.1">
                    </div>
                    <div class="player-col">
                        <input type="text" id="p3-name" class="init-input" placeholder="NM" maxlength="3">
                        <input type="number" id="p3-hcp" class="hcp-input" placeholder="0.0" step="0.1">
                    </div>
                    <div class="player-col">
                        <input type="text" id="p4-name" class="init-input" placeholder="NM" maxlength="3">
                        <input type="number" id="p4-hcp" class="hcp-input" placeholder="0.0" step="0.1">
                    </div>
                    <div class="player-col">
                        <input type="text" id="p5-name" class="init-input" placeholder="NM" maxlength="3">
                        <input type="number" id="p5-hcp" class="hcp-input" placeholder="0.0" step="0.1">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Gross Score (9 Holes)</label>
                <input type="number" id="gross-input" placeholder="e.g. 36" step="1">
            </div>

            <div class="calc-results" id="calc-results" style="display: none;">
                <div class="calc-details">
                    <span id="calc-sum">Sum: 0</span> / 
                    <span id="calc-divisor">Div: ?</span> = 
                    <span id="calc-team-hcp">Hcp: 0</span>
                </div>
                <div class="final-net-score">
                    Net Score: <span id="result-value">--</span>
                </div>
                <div class="calc-formula-text">
                    (Gross × 2) - Team Hcp
                </div>
            </div>
            
            <div id="calc-error" style="color: #e74c3c; font-size: 0.9em; text-align: center; display: none;">
                Enter at least 2 players
            </div>
        </div>   
    </main>
</body>
</html>
