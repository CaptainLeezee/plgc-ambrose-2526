<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-R" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambrose Scores</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>
    <main id="leaderboard">
        <h1 id="main-title">Loading...</h1>
        <div class="table-container">
            <table id="score-table">
                <thead>
                    <tr>
                        <th>Team Name</th>
                        <th>Rnd 1</th>
                        <th>Rnd 2</th>
                        <th>Rnd 3</th>
                        <th>Rnd 4</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="score-body">
                </tbody>
                <tfoot id="score-footer">
                </tfoot>
            </table>
        </div>
        <div class="note">
            * Grayed-out scores indicate a default score was registered.
        </div>

        <div class="chart-container">
            <h2>Team Totals Over Time</h2>
            <canvas id="scoreChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h2>Weekly Round Scores</h2>
            
            <p>Use the checkboxes to show/hide teams. (Lowest score is best).</p>
            
            <div id="team-toggle-container"></div>
            
            <canvas id="weeklyScoreChart"></canvas>
        </div>
        
    </main>
</body>
</html>
